appId: vnite
productName: Vnite

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!dev/*'
  - '!app/*'
  - '!docs/*'
  - '!native/**'
  - '!patches/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # rust build files
  - '!**/Cargo.toml'
  - '!**/Cargo.lock'
  - '!**/target/**'
  - '!**/*.rs'
  # Copy the workspace package explicitly; electron-builder 25 filters its linked source path.
  - from: native
    to: node_modules/vnite-native
    filter:
      - package.json
      - browser.js
      - dist/**/*

asarUnpack:
  - resources/**
  - '**/*.node'
  # subset-font resolves and reads this WASM file at runtime.
  - node_modules/harfbuzzjs/hb-subset.wasm

protocols:
  - name: Vnite Protocol
    schemes:
      - vnite

win:
  executableName: Vnite

nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh

mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false

dmg:
  artifactName: ${name}-${version}.${ext}

linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility

appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false

publish:
  provider: github
  owner: ximu3
  repo: vnite
