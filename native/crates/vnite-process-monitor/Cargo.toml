[package]
name = "vnite-process-monitor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
vnite-win32 = { path = "../vnite-win32" }
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes"
] }
windows-core = "0.62.0"
